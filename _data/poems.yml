# Lines for the poem widget. One is picked per day; "换一句" picks another.
# season (optional): spring | summer | autumn | winter — preferred in that season.
- { text: "长风破浪会有时，直挂云帆济沧海。", author: 李白, title: 行路难 }
- { text: "大鹏一日同风起，扶摇直上九万里。", author: 李白, title: 上李邕 }
- { text: "两岸猿声啼不住，轻舟已过万重山。", author: 李白, title: 早发白帝城 }
- { text: "孤帆远影碧空尽，唯见长江天际流。", author: 李白, title: 黄鹤楼送孟浩然之广陵 }
- { text: "会当凌绝顶，一览众山小。", author: 杜甫, title: 望岳 }
- { text: "星垂平野阔，月涌大江流。", author: 杜甫, title: 旅夜书怀 }
- { text: "野径云俱黑，江船火独明。", author: 杜甫, title: 春夜喜雨, season: spring }
- { text: "行到水穷处，坐看云起时。", author: 王维, title: 终南别业 }
- { text: "大漠孤烟直，长河落日圆。", author: 王维, title: 使至塞上 }
- { text: "人闲桂花落，夜静春山空。", author: 王维, title: 鸟鸣涧, season: spring }
- { text: "欲穷千里目，更上一层楼。", author: 王之涣, title: 登鹳雀楼 }
- { text: "海内存知己，天涯若比邻。", author: 王勃, title: 送杜少府之任蜀州 }
- { text: "落霞与孤鹜齐飞，秋水共长天一色。", author: 王勃, title: 滕王阁序, season: autumn }
- { text: "江畔何人初见月？江月何年初照人？", author: 张若虚, title: 春江花月夜 }
- { text: "春江潮水连海平，海上明月共潮生。", author: 张若虚, title: 春江花月夜, season: spring }
- { text: "莫愁前路无知己，天下谁人不识君。", author: 高适, title: 别董大, season: winter }
- { text: "沉舟侧畔千帆过，病树前头万木春。", author: 刘禹锡, title: 酬乐天扬州初逢席上见赠 }
- { text: "千淘万漉虽辛苦，吹尽狂沙始到金。", author: 刘禹锡, title: 浪淘沙 }
- { text: "自古逢秋悲寂寥，我言秋日胜春朝。", author: 刘禹锡, title: 秋词, season: autumn }
- { text: "晴空一鹤排云上，便引诗情到碧霄。", author: 刘禹锡, title: 秋词, season: autumn }
- { text: "停车坐爱枫林晚，霜叶红于二月花。", author: 杜牧, title: 山行, season: autumn }
- { text: "少年心事当拏云。", author: 李贺, title: 致酒行 }
- { text: "不畏浮云遮望眼，自缘身在最高层。", author: 王安石, title: 登飞来峰 }
- { text: "横看成岭侧成峰，远近高低各不同。", author: 苏轼, title: 题西林壁 }
- { text: "竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。", author: 苏轼, title: 定风波 }
- { text: "回首向来萧瑟处，归去，也无风雨也无晴。", author: 苏轼, title: 定风波 }
- { text: "人生如逆旅，我亦是行人。", author: 苏轼, title: 临江仙·送钱穆父 }
- { text: "但愿人长久，千里共婵娟。", author: 苏轼, title: 水调歌头, season: autumn }
- { text: "一年好景君须记，最是橙黄橘绿时。", author: 苏轼, title: 赠刘景文, season: autumn }
- { text: "山重水复疑无路，柳暗花明又一村。", author: 陆游, title: 游山西村 }
- { text: "纸上得来终觉浅，绝知此事要躬行。", author: 陆游, title: 冬夜读书示子聿, season: winter }
- { text: "问渠那得清如许？为有源头活水来。", author: 朱熹, title: 观书有感 }
- { text: "等闲识得东风面，万紫千红总是春。", author: 朱熹, title: 春日, season: spring }
- { text: "小荷才露尖尖角，早有蜻蜓立上头。", author: 杨万里, title: 小池, season: summer }
- { text: "千磨万击还坚劲，任尔东西南北风。", author: 郑燮, title: 竹石 }
- { text: "采菊东篱下，悠然见南山。", author: 陶渊明, title: 饮酒·其五, season: autumn }
- { text: "路漫漫其修远兮，吾将上下而求索。", author: 屈原, title: 离骚 }
- { text: "不积跬步，无以至千里；不积小流，无以成江海。", author: 荀子, title: 劝学 }
