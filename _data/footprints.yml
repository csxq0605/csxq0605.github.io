# Places I have been, for the layered world map.
#
# Every country is shown by its first-level divisions (provinces, states, prefectures).
# Inside China, a province opens a detail window with the prefecture-level cities.
#
# countries: one entry per country (ISO 3166-1 alpha-2 `code`).
#   regions:   first-level divisions visited.
#              China: DataV adcode, e.g. "650000". Elsewhere: ISO 3166-2, e.g. "US-CA".
#              home: true       → my base (marked separately)
#              counts_as: HK    → counted as its own country / region in the totals
#              city: true       → the division is itself a city (Beijing, Hong Kong, …)
#              cities:          → China only: prefecture-level cities visited inside it
#                                 (id = DataV adcode; Taiwan: ISO 3166-2 such as TW-TPE;
#                                 name = label shown on the map; a place with no shape
#                                 on the map can give zh, lat and lng instead)
#   A country or province without sub-entries is shown as visited as a whole.
#
# Detail maps exist for all 34 Chinese provinces, so adding provinces or cities needs
# no rebuild. Only a new country with its own province layer needs `npm run build`
# in scripts/map/ (add it to ADMIN1 in build.mjs).
countries:
  - code: CN
    name: China
    regions:
      - { id: "110000", name: Beijing, home: true, city: true }
      - { id: "120000", name: Tianjin, city: true }
