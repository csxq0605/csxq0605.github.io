name: Sync project READMEs

# Refresh the README copies shown in the homepage project panels
# (_projects/*.md and assets/projects/). Weekly, or run it by hand after
# updating a project's README.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy READMEs
        run: python3 scripts/sync_project_readmes.py
      - name: Commit changes
        run: |
          # Only the README text and images count; the sync date alone is not a change.
          if git diff --quiet -I '^synced_at:' -- _projects assets/projects && [ -z "$(git status --porcelain --untracked-files=all -- _projects assets/projects | grep '^??')" ]; then
            echo "READMEs unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _projects assets/projects
          git commit -m "Sync project READMEs"
          git push
