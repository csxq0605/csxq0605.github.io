<section class="widget widget--today" aria-labelledby="w-today" data-widget-today>
  <h2 class="widget__label" id="w-today">Today · 今日</h2>
  <div class="today__date"><span class="today__day" data-day>—</span><span class="today__month"><span data-month></span><span data-weekday></span></span></div>
  <p class="today__lunar" data-lunar></p>
  <dl class="today__rows">
    <div><dt>节气</dt><dd data-term></dd></div>
    <div><dt>下一个</dt><dd data-next></dd></div>
  </dl>
  <div class="meter" data-year-meter><span class="meter__label"><span data-year-label>2026</span><span data-year-pct></span></span><span class="meter__track"><span class="meter__fill" data-year-fill></span></span></div>
  <div class="meter" data-day-meter><span class="meter__label"><span>Today in Beijing</span><span data-day-pct></span></span><span class="meter__track"><span class="meter__fill" data-day-fill></span></span></div>
</section>
