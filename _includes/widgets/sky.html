<section class="widget widget--sky" aria-labelledby="w-sky" data-widget-sky>
  <h2 class="widget__label" id="w-sky">Sky over Beijing</h2>
  <div class="sky">
    <svg class="moon" viewBox="-50 -50 100 100" width="44" height="44" role="img" aria-labelledby="w-moon-label"><title id="w-moon-label">Moon phase</title><circle class="moon__dark" r="46"/><path class="moon__lit" data-moon-lit d=""/></svg>
    <div>
      <p class="sky__phase" data-moon-name>—</p>
      <p class="sky__sun"><span data-sunrise>—</span><br><span data-sunset>—</span></p>
      <p class="sky__daylen" data-daylen></p>
    </div>
  </div>
</section>
