{%- comment -%} Widget column: order and on/off in _data/widgets.yml {%- endcomment -%}
<aside class="widgets" aria-label="Widgets">
  {%- for w in site.data.widgets.sidebar -%}
    {%- capture path -%}widgets/{{ w }}.html{%- endcapture -%}
    {% include {{ path }} %}
  {%- endfor -%}
  <script type="application/json" id="widget-data">{"calendar": {{ site.data.calendar | jsonify }}, "poems": {{ site.data.poems | jsonify }}, "activity": {{ site.data.github_activity | jsonify }}}</script>
</aside>
