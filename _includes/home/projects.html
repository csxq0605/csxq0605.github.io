<div class="cards">
  {%- for p in site.data.projects %}
  <article class="card-project" data-project="{{ p.slug }}">
    <h3 class="card-project__name"><a href="{{ '/projects/' | append: p.slug | append: '/' | relative_url }}" data-project-open>{{ p.name }}</a></h3>
    <p class="card-project__tagline">{{ p.tagline }}</p>
    <ul class="card-project__tags" aria-label="Built with">{% for t in p.tags %}<li>{{ t }}</li>{% endfor %}</ul>
    <div class="card-project__foot">
      <span class="card-project__open" aria-hidden="true">Details &amp; README{% include site/icon.html name='arrow' %}</span>
      <a class="card-project__repo" href="{{ p.url }}" target="_blank" rel="noopener" aria-label="{{ p.name }} on GitHub">{% include site/icon.html name='github' %}</a>
    </div>
  </article>
  {%- endfor %}
</div>

<dialog class="drawer" id="project-drawer" aria-labelledby="drawer-title">
  <div class="drawer__head">
    <div>
      <p class="eyebrow" data-drawer-repo></p>
      <h2 id="drawer-title" data-drawer-title></h2>
    </div>
    <div class="drawer__actions">
      <a class="button" data-drawer-github target="_blank" rel="noopener">{% include site/icon.html name='github' %} GitHub</a>
      <a class="button" data-drawer-page>Full page</a>
      <button class="icon-button" type="button" data-drawer-close aria-label="Close">✕</button>
    </div>
  </div>
  <div class="drawer__body prose" data-drawer-body tabindex="0"></div>
</dialog>
