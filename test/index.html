<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUNer 人格测试 | 你是哪种模联人？</title>
  <style>
    :root {
      --blue: #009EDB;
      --blue-dark: #007ab8;
      --dark: #0d1b2a;
      --dark2: #1a2d40;
      --gold: #f5a623;
      --gold-dark: #d4891e;
      --bg: #f0f4f8;
      --card: #ffffff;
      --text: #1a2332;
      --muted: #64748b;
      --border: #e2e8f0;
      --green: #10b981;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .site-header {
      background: var(--dark);
      color: white;
      text-align: center;
      padding: 18px 16px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-header .logo { font-size: 13px; letter-spacing: .15em; opacity: .6; text-transform: uppercase; margin-bottom: 2px; }
    .site-header h1 { font-size: 20px; font-weight: 700; }

    /* ── SCREENS ── */
    .screen { display: none; max-width: 680px; margin: 0 auto; padding: 28px 16px 60px; }
    .screen.active { display: block; }

    /* ── START SCREEN ── */
    .start-card {
      background: var(--card);
      border-radius: 20px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,.09);
    }
    .start-card .emoji { font-size: 72px; line-height: 1; margin-bottom: 20px; }
    .start-card h2 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
    .start-card .tagline { font-size: 15px; color: var(--muted); line-height: 1.7; margin-bottom: 28px; max-width: 380px; margin-left: auto; margin-right: auto; }
    .start-stats { display: flex; justify-content: center; gap: 32px; margin-bottom: 36px; }
    .stat-item .num { font-size: 30px; font-weight: 800; color: var(--blue); }
    .stat-item .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn-start {
      background: var(--blue);
      color: white;
      border: none;
      padding: 16px 56px;
      border-radius: 50px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      letter-spacing: .03em;
    }
    .btn-start:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,158,219,.35); }
    .disclaimer { font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.6; }

    /* ── QUIZ SCREEN ── */
    .prog-wrap { margin-bottom: 20px; }
    .prog-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .prog-meta strong { color: var(--blue); }
    .prog-track { background: var(--border); height: 8px; border-radius: 4px; overflow: hidden; }
    .prog-fill { background: linear-gradient(90deg, var(--blue), #4fc3f7); height: 100%; border-radius: 4px; transition: width .35s ease; }

    .q-card {
      background: var(--card);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      margin-bottom: 16px;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .q-num { font-size: 12px; color: var(--blue); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 10px; }
    .q-text { font-size: 18px; font-weight: 600; line-height: 1.55; margin-bottom: 24px; }

    .options { display: flex; flex-direction: column; gap: 11px; }
    .opt {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      line-height: 1.5;
      transition: all .18s;
      background: white;
      text-align: left;
    }
    .opt:hover { border-color: var(--blue); background: #f0f9ff; }
    .opt.selected { border-color: var(--blue); background: #e8f4fd; }
    .opt-letter {
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--border);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all .18s;
    }
    .opt.selected .opt-letter { background: var(--blue); color: white; }

    .q-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .btn-nav {
      padding: 12px 28px;
      border-radius: 50px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
    }
    .btn-prev { background: var(--border); color: var(--muted); }
    .btn-prev:hover { background: #d1d5db; }
    .btn-next { background: var(--blue); color: white; }
    .btn-next:hover:not(:disabled) { background: var(--blue-dark); }
    .btn-next:disabled { background: #b3d9f0; cursor: not-allowed; }
    .btn-submit { background: var(--gold); color: white; }
    .btn-submit:hover { background: var(--gold-dark); }

    .warn-text { font-size: 13px; color: #ef4444; text-align: center; min-height: 20px; margin-bottom: 8px; }

    /* ── LOADING ── */
    .loading-screen {
      text-align: center;
      padding: 80px 0;
    }
    .loading-emoji { font-size: 56px; animation: pulse 1.2s ease infinite; margin-bottom: 20px; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
    .loading-text { font-size: 16px; color: var(--muted); }

    /* ── RESULT SCREEN ── */
    .result-hero {
      background: linear-gradient(135deg, var(--dark) 0%, var(--dark2) 100%);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      color: white;
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }
    .result-hero::before {
      content: '';
      position: absolute;
      top: -40%;
      right: -20%;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,158,219,.25), transparent 70%);
    }
    .result-hero .type-label { font-size: 12px; letter-spacing: .15em; opacity: .6; text-transform: uppercase; margin-bottom: 10px; }
    .result-hero .type-emoji { font-size: 60px; margin-bottom: 12px; }
    .result-hero .type-name { font-size: 36px; font-weight: 800; margin-bottom: 8px; }
    .result-hero .match-line { font-size: 15px; opacity: .8; }
    .result-hero .match-line span { font-size: 26px; font-weight: 800; color: var(--gold); }

    .result-card {
      background: var(--card);
      border-radius: 18px;
      padding: 26px 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,.07);
      margin-bottom: 14px;
    }
    .result-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 14px;
      padding-left: 12px;
      border-left: 4px solid var(--blue);
    }
    .result-desc { font-size: 15px; line-height: 1.85; color: var(--text); }
    .result-quote {
      margin-top: 14px;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 10px;
      font-size: 14px;
      color: var(--muted);
      font-style: italic;
      border-left: 3px solid var(--gold);
    }

    .dim-list { display: flex; flex-direction: column; gap: 12px; }
    .dim-row { display: flex; align-items: center; gap: 12px; }
    .dim-name { font-size: 13px; color: var(--muted); width: 68px; flex-shrink: 0; }
    .dim-track { flex: 1; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
    .dim-bar { height: 100%; border-radius: 4px; }
    .dim-bar.blue { background: var(--blue); }
    .dim-bar.gold { background: var(--gold); }
    .dim-bar.green { background: var(--green); }
    .dim-bar.red { background: #f87171; }
    .dim-bar.purple { background: #a78bfa; }
    .dim-val { font-size: 13px; font-weight: 700; width: 34px; text-align: right; }

    .secondary-types { display: flex; flex-wrap: wrap; gap: 8px; }
    .sec-badge {
      padding: 5px 14px;
      border-radius: 50px;
      background: var(--bg);
      font-size: 13px;
      color: var(--muted);
      border: 1px solid var(--border);
    }

    .btn-restart {
      width: 100%;
      padding: 16px;
      background: var(--blue);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      margin-top: 6px;
    }
    .btn-restart:hover { background: var(--blue-dark); }

    @media(max-width:480px) {
      .start-card { padding: 28px 20px; }
      .q-card { padding: 24px 18px; }
      .q-text { font-size: 16px; }
      .opt { font-size: 14px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="logo">MUNer Personality Test</div>
  <h1>模联人格测试</h1>
</header>

<!-- START -->
<div id="start" class="screen active">
  <div class="start-card">
    <div class="emoji">🌐</div>
    <h2>你是哪种模联人？</h2>
    <p class="tagline">
      31道关于模拟联合国的灵魂拷问，<br>
      测出你在模联世界里真正的生存姿态。<br>
      <em>本测试无任何科学依据，仅供娱乐自嘲。</em>
    </p>
    <div class="start-stats">
      <div class="stat-item"><div class="num">31</div><div class="lbl">道题目</div></div>
      <div class="stat-item"><div class="num">16</div><div class="lbl">种人格</div></div>
      <div class="stat-item"><div class="num">5</div><div class="lbl">个维度</div></div>
    </div>
    <button class="btn-start" onclick="startQuiz()">开始测试</button>
    <p class="disclaimer">
      本测试为模联爱好者的自娱自乐产物，<br>
      与任何正规心理学评估无关。<br>
      大约需要 5-8 分钟完成。
    </p>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen">
  <div class="prog-wrap">
    <div class="prog-meta">
      <span>第 <strong id="qNum">1</strong> 题 / 31</span>
      <span id="qPct">0%</span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  </div>
  <div class="q-card" id="qCard">
    <div class="q-num" id="qNumLabel">Q 01</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optList"></div>
  </div>
  <div class="warn-text" id="warnText"></div>
  <div class="q-nav">
    <button class="btn-nav btn-prev" id="btnPrev" onclick="prevQ()">← 上一题</button>
    <button class="btn-nav btn-next" id="btnNext" onclick="nextQ()">下一题 →</button>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-hero">
    <div class="type-label">你的模联人格</div>
    <div class="type-emoji" id="rEmoji"></div>
    <div class="type-name" id="rName"></div>
    <div class="match-line">匹配度 <span id="rMatch"></span>%</div>
  </div>

  <div class="result-card">
    <h3>人格解读</h3>
    <div class="result-desc" id="rDesc"></div>
    <div class="result-quote" id="rQuote"></div>
  </div>

  <div class="result-card">
    <h3>五维分析</h3>
    <div class="dim-list" id="dimList"></div>
  </div>

  <div class="result-card">
    <h3>次要倾向</h3>
    <div class="secondary-types" id="secTypes"></div>
  </div>

  <button class="btn-restart" onclick="restart()">再测一次</button>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────

      { text: '当然，我现在还在开会',           types: { 知名模联人:3 },                   dims: { exp:3, ind:3, rom:2 } },
      { text: '偶尔刷到相关内容会停下来看',     types: { 热泪盈眶:2 },                     dims: { rom:3, exp:2 } },
      { text: '已经淡出，但有时会想起',          types: { 热泪盈眶:1 },                     dims: { rom:2 } },
      { text: '早就不关注了，那是年轻时的事',   types: { 观察员:2 },                        dims: { rom:-1 } }
    ]
  },
  {
    text: '你在模联场合认识了一个很有意思的人，你会？',
    opts: [
      { text: '认真聊，建立真实的联系',          types: { 知名模联人:2 },                   dims: { soc:3, rom:2 } },
      { text: '加微信，说不定以后有用',          types: { 意大利正统:2, 包工头:1 },         dims: { sch:2, soc:2 } },
      { text: '拍张合照，发朋友圈',             types: { 朋友圈特种兵:2 },                  dims: { soc:1 } },
      { text: '点点头，然后继续刷手机',          types: { 观察员:3 },                        dims: { soc:-2 } }
    ]
  },
  {
    text: '最后一题：如果要给自己的模联生涯写一句墓志铭，你会写？',
    opts: [
      { text: '"永远在场，永远在发言。"',        types: { 知名模联人:2, 天无二日:1 },        dims: { exp:3, ind:2 } },
      { text: '"九宫格是最美的决议草案。"',       types: { 朋友圈特种兵:3 },                  dims: { soc:2 } },
      { text: '"格式永远无可挑剔。"',            types: { 格式警察:3 },                     dims: { ind:3 } },
      { text: '"来过，但没有人注意到。"',         types: { 观察员:3 },                        dims: {} }
    ]
  }
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

// ─────────────────────────────────────────────
// INIT / RENDER
// ─────────────────────────────────────────────
function startQuiz() {
  showScreen('quiz');
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQ();
}

function renderQ() {
  const q = QUESTIONS[current];
  const letters = ['A', 'B', 'C', 'D'];

  document.getElementById('qNum').textContent = current + 1;
  document.getElementById('qPct').textContent = Math.round((current / QUESTIONS.length) * 100) + '%';
  document.getElementById('progFill').style.width = (current / QUESTIONS.length * 100) + '%';
  document.getElementById('qNumLabel').textContent = 'Q ' + String(current + 1).padStart(2, '0');
  document.getElementById('qText').textContent = q.text;
  document.getElementById('warnText').textContent = '';

  // Rebuild options
  const list = document.getElementById('optList');
  list.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[current] === i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span><span>${opt.text}</span>`;
    btn.onclick = () => selectOpt(i);
    list.appendChild(btn);
  });

  // Nav buttons
  document.getElementById('btnPrev').style.display = current === 0 ? 'none' : '';
  const isLast = current === QUESTIONS.length - 1;
  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = isLast ? '查看结果 ✨' : '下一题 →';
  btnNext.className = 'btn-nav btn-next' + (isLast ? ' btn-submit' : '');
  btnNext.disabled = answers[current] === null;

  // Re-animate
  const card = document.getElementById('qCard');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';
}

function selectOpt(idx) {
  answers[current] = idx;
  document.getElementById('warnText').textContent = '';
  document.getElementById('btnNext').disabled = false;
  // Re-render options
  const opts = document.querySelectorAll('.opt');
  opts.forEach((o, i) => o.classList.toggle('selected', i === idx));
  document.querySelector(`.opt:nth-child(${idx + 1}) .opt-letter`).style.background = '';
}

function nextQ() {
  if (answers[current] === null) {
    document.getElementById('warnText').textContent = '请先选择一个选项 ~';
    return;
  }
  if (current < QUESTIONS.length - 1) {
    current++;
    renderQ();
  } else {
    computeResult();
  }
}

function prevQ() {
  if (current > 0) { current--; renderQ(); }
}

// ─────────────────────────────────────────────
// SCORING
// ─────────────────────────────────────────────
function computeResult() {
  // Show loading
  showScreen('quiz');
  const quizEl = document.getElementById('quiz');
  quizEl.innerHTML = `
    <div class="loading-screen">
      <div class="loading-emoji">🌐</div>
      <div class="loading-text">正在分析你的外交人格……</div>
    </div>`;

  setTimeout(() => {
    // Tally type scores
    const typeScores = {};
    Object.keys(TYPES).forEach(t => typeScores[t] = 0);

    // Tally dim scores
    const dimRaw = { exp:0, ind:0, soc:0, sch:0, rom:0 };

    answers.forEach((sel, qi) => {
      if (sel === null) return;
      const opt = QUESTIONS[qi].opts[sel];
      Object.entries(opt.types).forEach(([t, p]) => { typeScores[t] = (typeScores[t]||0) + p; });
      Object.entries(opt.dims).forEach(([d, p])  => { dimRaw[d] = (dimRaw[d]||0) + p; });
    });

    // Find winner
    const sorted = Object.entries(typeScores).sort((a,b) => b[1]-a[1]);
    const winner = sorted[0][0];
    const winScore = sorted[0][1];
    const totalPossible = QUESTIONS.length * 3;
    const matchPct = Math.min(99, Math.max(72, Math.round((winScore / totalPossible) * 100 * 2.5)));

    // Normalise dims to 0-100
    const dimMax = 15;
    const dimNorm = {};
    DIMS.forEach(d => {
      dimNorm[d.key] = Math.round(((dimRaw[d.key] + dimMax) / (dimMax * 2)) * 100);
    });

    renderResult(winner, matchPct, dimNorm, sorted.slice(1,4).map(s=>s[0]));
  }, 1800);
}

// ─────────────────────────────────────────────
// RESULT RENDER
// ─────────────────────────────────────────────
function renderResult(typeName, matchPct, dimNorm, secondary) {
  const t = TYPES[typeName];

  document.getElementById('rEmoji').textContent = t.emoji;
  document.getElementById('rName').textContent = typeName;
  document.getElementById('rMatch').textContent = matchPct;
  document.getElementById('rDesc').textContent = t.desc;
  document.getElementById('rQuote').textContent = t.quote;

  // Dims
  const dimList = document.getElementById('dimList');
  dimList.innerHTML = '';
  DIMS.forEach(d => {
    const v = dimNorm[d.key];
    const row = document.createElement('div');
    row.className = 'dim-row';
    row.innerHTML = `
      <span class="dim-name">${d.label}</span>
      <div class="dim-track">
        <div class="dim-bar ${d.color}" style="width:${v}%"></div>
      </div>
      <span class="dim-val" style="color:var(--${d.color})">${v}</span>
    `;
    dimList.appendChild(row);
  });

  // Secondary
  const secEl = document.getElementById('secTypes');
  secEl.innerHTML = secondary.map(s =>
    `<span class="sec-badge">${TYPES[s].emoji} ${s}</span>`
  ).join('');

  showScreen('result');
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  // Restore quiz HTML in case it was replaced by loading screen
  const quizEl = document.getElementById('quiz');
  quizEl.innerHTML = `
    <div class="prog-wrap">
      <div class="prog-meta">
        <span>第 <strong id="qNum">1</strong> 题 / 31</span>
        <span id="qPct">0%</span>
      </div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    </div>
    <div class="q-card" id="qCard">
      <div class="q-num" id="qNumLabel">Q 01</div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="optList"></div>
    </div>
    <div class="warn-text" id="warnText"></div>
    <div class="q-nav">
      <button class="btn-nav btn-prev" id="btnPrev" onclick="prevQ()">← 上一题</button>
      <button class="btn-nav btn-next" id="btnNext" onclick="nextQ()">下一题 →</button>
    </div>
  `;
  startQuiz();
}
</script>
