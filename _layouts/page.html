---
layout: site
---
<main class="page {% if page.wide %}page--wide{% endif %}" id="content" tabindex="-1">
  <header class="page__header">
    {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.heading | default: page.title }}</h1>
    {% if page.lede %}<p class="page__lede">{{ page.lede }}</p>{% endif %}
  </header>
  {{ content }}
</main>
